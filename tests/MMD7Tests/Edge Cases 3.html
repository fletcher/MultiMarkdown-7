<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
	<meta charset="utf-8"/>
	<title>Edge Cases 3</title>
</head>
<body>
<h1 id="foo">foo</h1>

<figure>
<img src="image/foo.png" alt="foo" id="foo" />
<figcaption>foo</figcaption>
</figure>

<p>What about <a href="image/foo.png">this</a>.</p>

<figure>
<img src="image/bar.png" alt="bar" id="bar" />
<figcaption>bar</figcaption>
</figure>

<p>Or <a href="image/bar.png">that</a>.</p>

<h1 id="bar">bar</h1>
</body>
</html>
